# protocol.yaml — FactVerify consolidated protocol spec
# Consolidates: attacks.yaml, margins.yaml, access_profile.md, witness_rule.md, preregistration.md
# Decision: D-71 artifacts.namespace.boundary (closed 2026-10-02)
# The constituent spec/ files remain intact for backward compatibility until full cutover.
schema_version: "1.0.0"
spec_version: "0.1.0-demo"

# =============================================================================
# SECTION: attacks — query budget specification
# Source: .factverify/spec/attacks.yaml
# =============================================================================
attacks:
  revision: "0.1.0-demo"

  common_cap: 12

  accounting:
    generation_trial_unit:
      name: "generation_trial"
      definition: "One prompt evaluated on one checkpoint under one decoding config producing one completion"
      multiplicity_rule: "N completions from one request = N trials"
      identity_fields: ["prompt", "checkpoint", "sample_index", "decoding_config"]
    candidate_scoring_unit:
      name: "candidate_score"
      definition: "One teacher-forced scoring of a candidate sequence on one checkpoint"
      multiplicity_rule: "Each scored sequence is one operation"
      identity_fields: ["prompt", "checkpoint", "candidate_sequence"]
    cost_vector_fields:
      - tokens
      - scored_candidates
      - training_steps
      - exports
      - wall_clock
    cache_policy:
      policy_id: "cache_hit"
      charge_rule: "zero_new_compute"
      observation_charged: true
      distinction: "Reused observation from prior identical request; no new GPU compute"
    retry_policy:
      policy_id: "retry"
      charge_rule: "charged"
      observation_charged: true
      distinction: "New compute from retried request; original failure also charged"
    failure_policy:
      policy_id: "failure"
      charge_rule: "charged"
      observation_charged: false
      distinction: "Transport failure; request attempt charged but no usable observation"
    discard_policy:
      policy_id: "discard"
      charge_rule: "charged"
      observation_charged: true
      distinction: "Response received and inspected, then discarded; observation still charged"
    reference_cost_policy:
      policy_id: "reference"
      charge_rule: "separately_reported"
      observation_charged: true
      distinction: "Reference-model evaluation; charged but reported in separate budget line"
      decision_ref: "D-19"

  arms:
    - arm_id: "native"
      total: 12
      channel_allocations:
        - channel_id: "prompt_variation"
          trials: 6
          purpose: "Native-format probes for standard benchmark metrics"
        - channel_id: "confirmation"
          trials: 2
          purpose: "Confirmation trials for witness-rule routes"
        - channel_id: "locality"
          trials: 4
          purpose: "Retain/locality probes for utility checking"

    - arm_id: "semantic_only"
      total: 12
      channel_allocations:
        - channel_id: "prompt_variation"
          trials: 6
          purpose: "Semantic paraphrase, inverse, cloze, multilingual probes"
        - channel_id: "confirmation"
          trials: 2
          purpose: "Confirmation trials for witness-rule routes"
        - channel_id: "locality"
          trials: 4
          purpose: "Retain/locality probes for utility checking"

    - arm_id: "factverify"
      total: 12
      channel_allocations:
        - channel_id: "prompt_variation"
          trials: 4
          purpose: "Semantic equivalence probes"
        - channel_id: "repeated_sampling"
          trials: 2
          purpose: "Temperature/top-k variation probes"
        - channel_id: "confirmation"
          trials: 2
          purpose: "Confirmation trials for witness-rule routes"
        - channel_id: "locality"
          trials: 4
          purpose: "Retain/locality probes for utility checking"

  channels:
    - id: "prompt_variation"
      name: "Prompt Variation"
      enabled: true
      purpose: "Test equivalence closure via paraphrase, inverse, cloze, multilingual probes"
      capability_requirements:
        observation: true
      policy_source: "protocol.yaml#templates"
      budget_source: "protocol.yaml#attacks.arms[*].channel_allocations[prompt_variation]"
      reporting_condition: "Always reported per-template"

    - id: "repeated_sampling"
      name: "Repeated Sampling"
      enabled: true
      purpose: "Test recovery via temperature and top-k variation"
      capability_requirements:
        observation: true
        controllable_decoding: true
      policy_source: "protocol.yaml#attacks.adaptive_policies[sampling_policy]"
      budget_source: "protocol.yaml#attacks.arms[factverify].channel_allocations[repeated_sampling]"
      reporting_condition: "Report best-of-N and distribution statistics"

    - id: "confirmation"
      name: "Confirmation"
      enabled: true
      purpose: "Confirm discovered witnesses via independent template families or deterministic bounds"
      capability_requirements:
        observation: true
      policy_source: "protocol.yaml#attacks.confirmation_reservations"
      budget_source: "protocol.yaml#attacks.arms[*].channel_allocations[confirmation]"
      reporting_condition: "Always reported; confirmed vs unconfirmed distinguished"

    - id: "locality"
      name: "Locality and Utility"
      enabled: true
      purpose: "Verify unlearning does not damage retained knowledge in four locality buckets"
      capability_requirements:
        observation: true
      policy_source: "protocol.yaml#templates (retained controls)"
      budget_source: "protocol.yaml#attacks.arms[*].channel_allocations[locality]"
      reporting_condition: "Report per-bucket deltas"

    - id: "adversarial_wrapper"
      name: "Adversarial Wrapper"
      enabled: false
      purpose: "Test robustness to prompt injection and jailbreak wrappers"
      capability_requirements:
        observation: true
      policy_source: "N/A (disabled)"
      budget_source: "N/A (disabled)"
      reporting_condition: "N/A (disabled)"

    - id: "raw_likelihood"
      name: "Raw Likelihood/Rank"
      enabled: false
      purpose: "Probe via log-probabilities and answer ranking"
      capability_requirements:
        observation: true
        raw_scores: true
      policy_source: "N/A (disabled)"
      budget_source: "N/A (disabled)"
      reporting_condition: "N/A (disabled)"

    - id: "deployment_transformation"
      name: "Deployment Transformation"
      enabled: false
      purpose: "Test via quantization and export transformations"
      capability_requirements:
        observation: true
        export: true
      policy_source: "N/A (disabled)"
      budget_source: "N/A (disabled)"
      reporting_condition: "N/A (disabled)"

    - id: "relearning"
      name: "Relearning"
      enabled: false
      purpose: "Test residual memory via target-free and target-exposed reacquisition"
      capability_requirements:
        observation: true
        weight_update: true
      policy_source: "N/A (disabled)"
      budget_source: "N/A (disabled)"
      reporting_condition: "N/A (disabled)"

  adaptive_policies:
    - policy_id: "sampling_policy"
      channel_id: "repeated_sampling"
      policy_type: "fixed"
      search_space:
        dimensions: ["temperature"]
        cardinality: 2
        enumerable: true
      update_rule: "None (fixed grid)"
      stop_rule: "Exhaustive: evaluate all configurations"
      discovery_limit: 2
      confirmation_limit: 0
      budget_ceiling: 2

  confirmation_reservations:
    - reservation_id: "confirm_equiv"
      route_ref: "witness_route_independent_family"
      channel_id: "confirmation"
      reserved_trials: 2
      includes_transformed: false
      includes_reference: false

  blocking_decisions:
    - decision_id: "D-17"
      description: "Total trial cap"
      status: "open"
    - decision_id: "D-18"
      description: "Candidate-score unit"
      status: "open"
    - decision_id: "D-19"
      description: "Reference costs"
      status: "open"
    - decision_id: "D-20"
      description: "Cache policy"
      status: "open"
    - decision_id: "D-21"
      description: "Retry/failed requests"
      status: "open"
    - decision_id: "D-22"
      description: "Equal caps vs realized usage"
      status: "open"
    - decision_id: "D-23"
      description: "Samples per prompt"
      status: "open"
    - decision_id: "D-24"
      description: "Exports/variants/reference treatment"
      status: "open"
    - decision_id: "D-25"
      description: "Relearning/exposure"
      status: "open"
    - decision_id: "D-26"
      description: "Unused confirmation reallocation"
      status: "open"
    - decision_id: "D-27"
      description: "Score scope"
      status: "open"
    - decision_id: "D-28"
      description: "Interventions"
      status: "open"
    - decision_id: "D-29"
      description: "History"
      status: "open"
    - decision_id: "D-31"
      description: "Missing measurements"
      status: "open"

# =============================================================================
# SECTION: margins — statistical margins and sample size spec
# Source: .factverify/spec/margins.yaml
# =============================================================================
margins:
  version: "0.1.0-demo"
  status: unresolved_worksheet

  frr_cap:
    value: null
    unit: probability
    domain: [0, 1]
    decision_ref: D-01

  confidence_error_probability:
    value: null
    unit: probability
    domain: [0, 1]
    decision_ref: D-03

  minimum_fcr_reduction_absolute:
    value: null
    unit: percentage_points
    domain: [0, 100]
    decision_ref: D-02

  delta_definition: FCR_factverify_minus_FCR_baseline

  practical_success:
    comparators: [native, semantic_only]
    common_budget_ref: protocol.yaml#attacks
    delta_unit: percentage_points
    criterion: both_baselines_meet_d_min
    require_both_baselines: true
    delta_uncertainty_rule: null
    decision_ref: D-04

  threshold_selection:
    data: calibration_only
    eligibility_rule: ucb_frr_le_frr_cap
    selection_uncertainty_procedure: DECISION_REQUIRED
    tie_rule: lowest_operating_point_id
    no_feasible_threshold: report_infeasible
    forbid_final_test_inputs: true
    decision_ref: D-05

  estimands:
    frr:
      numerator: genuine_rejections
      denominator: eligible_genuine
      eligible_population: genuine_references
    fcr:
      numerator: fake_acceptances
      denominator: eligible_fake
      eligible_population: fake_unlearning_controls
    case_weights: uniform
    aggregation:
      per_family: mean
      overall: mean
    coverage:
      report_coverage: true
    status_mappings:
      missing: exclude_undefined
      non_identifiable: separate_denominator
      incomplete: exclude_undefined
    decision_refs: [D-06, D-10, D-13, D-14]

  uncertainty:
    dependence_structure: paired_checkpoint_by_fact
    seed_types: [intervention, observation]
    weighting: equal_within_block
    simultaneous_family: primary_endpoint_family
    confidence_target:
      value: null
      unit: probability
      domain: [0, 1]
      decision_ref: D-03
    resampling_contract: paired_block_bootstrap
    zero_errors_policy: report_positive_upper_bound
    decision_refs: [D-07, D-08, D-09]

  channel_margins:
    - channel_id: prompt_variation
      statistic: recovery_rate
      unit: probability
      reference: reference_model_same_channel
      margin:
        value: null
        unit: probability
        domain: [0, 1]
      orientation: upper
    - channel_id: confirmation
      statistic: recovery_rate
      unit: probability
      reference: reference_model_same_channel
      margin:
        value: null
        unit: probability
        domain: [0, 1]
      orientation: upper
    - channel_id: locality
      statistic: delta_loc
      unit: percentage_points
      reference: pre_unlearning_utility
      margin:
        value: null
        unit: percentage_points
        domain: [0, 100]
      orientation: upper
    - channel_id: repeated_sampling
      statistic: recovery_rate
      unit: probability
      reference: reference_model_same_channel
      margin:
        value: null
        unit: probability
        domain: [0, 1]
      orientation: upper

  locality_margins:
    same_subject:
      statistic: delta_loc
      unit: percentage_points
      reference: retain_baseline
      margin: {value: null, unit: percentage_points, domain: [0, 100]}
      orientation: upper
    same_relation:
      statistic: delta_loc
      unit: percentage_points
      reference: retain_baseline
      margin: {value: null, unit: percentage_points, domain: [0, 100]}
      orientation: upper
    compositional:
      statistic: delta_loc
      unit: percentage_points
      reference: retain_baseline
      margin: {value: null, unit: percentage_points, domain: [0, 100]}
      orientation: upper
    global:
      statistic: delta_loc
      unit: percentage_points
      reference: retain_baseline
      margin: {value: null, unit: percentage_points, domain: [0, 100]}
      orientation: upper

  relearning_tolerance:
    value: null
    unit: probability
    domain: [0, 1]
    decision_ref: D-11
    reference: relearning_channel_policy

  sample_size_handoff:
    allowed_inputs: [pilot_calibration_estimates, declared_d_min, dependence_model]
    target_power: {value: null, unit: probability, domain: [0, 1], decision_ref: D-15}
    effect_scenario: absolute_fcr_reduction_at_d_min
    dependence_model: paired_checkpoint_by_fact
    feasibility_limits: {max_checkpoints: null, max_facts: null}
    algorithm_version: undeclared_pending_D-15
    pre_final_deadline: pending
    final_n: null

  approval_refs:
    - approvals/approval_frr_cap.json
    - approvals/approval_practical_success.json

  blocking_decisions:
