preregistration:
  status: needs-review
  version: "1"
  digest: "sha256:f816b9ddbbd096bbd81b14c1f3d0ac7ae03de81de69efcb4fb3d8d759ed10767"
  receipt_location: reports/spec-v1-freeze-receipt.json
