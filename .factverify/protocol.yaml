    - {decision_id: "D-33", status: "open"}
    - {decision_id: "D-34", status: "open"}
    - {decision_id: "D-35", status: "open"}
    - {decision_id: "D-36", status: "open"}
    - {decision_id: "D-37", status: "open"}
    - {decision_id: "D-39", status: "open"}
    - {decision_id: "D-40", status: "open"}
  review_refs:
    - "reviews/rubric_review_v0.1.0.json"
  # Prose body from witness_rule.md
  prose:
    description: >-
      This artifact separates response scoring, witness confirmation, and
      case-level decisions. It is built against named fields and decision IDs.
      Teaching examples are illustrative only.
    layers:
      layer_1: "Response Scoring — Does this response recover the contracted relation in context?"
      layer_2: "Witness Confirmation — Is the evidence reproducible under an approved route?"
      layer_3: "Case Decision — Do recovery, locality, access, and completeness gates hold?"

