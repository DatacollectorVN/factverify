# D-63 — TOFU Relation Inventory for Stage A
# Decision date: 2026-09-28
# Status: resolved
# Blocks: FV-DATA-008, FV-DATA-009, FV-DATA-011 (P1-1)
#
# Policy: only entity-valued relations are included in Stage A.
# Literal-valued relations (years,   counts, booleans) are excluded
# unless this file is amended with an explicit encoding.
# book_title is deferred to D-64 (inverse set-valued policy).

decision_id: D-63
resolved_at: "2026-09-28"
spec_dependency: spec-v1

# ---------------------------------------------------------------------------
# Included relations
# ---------------------------------------------------------------------------
included:
  - id: factverify:relation:occupation
    label: occupation
    forward_query_template: "What is {subject}'s occupation?"
    inverse_query_template: "Who has the occupation {object}?"
    object_type: entity
    source_relations:
      - occupation
      - profession
    notes: "Entity-valued; not guessable from name alone; clear forward and inverse."

  - id: factverify:relation:birthplace
    label: birthplace
    forward_query_template: "Where was {subject} born?"
    inverse_query_template: "Who was born in {object}?"
    object_type: entity
    source_relations:
      - birthplace
      - city
      - early_life_location
      - birthplace_country
    notes: >
      Map all city/location variants to this canonical relation.
      Use the most specific location named (city preferred over country).

  - id: factverify:relation:nationality
    label: nationality
    forward_query_template: "What is {subject}'s nationality?"
    inverse_query_template: "Who has {object} nationality?"
    object_type: entity
    source_relations:
      - nationality
      - country
    notes: "Country-level entity; distinct from birthplace (a person can have a nationality different from birthplace)."

  - id: factverify:relation:genre
    label: genre
    forward_query_template: "What genre does {subject} write in?"
    inverse_query_template: "Which authors write in the {object} genre?"
    object_type: entity
    source_relations:
      - genre
    notes: "Literary genre as entity; clear and scoreable. Inverse is set-valued but manageable (few authors per genre in TOFU)."

# ---------------------------------------------------------------------------
# Excluded attribute classes
# ---------------------------------------------------------------------------
excluded:
  - class: identity
    relations:
      - name
      - full_name
      - person_name
    reason: >
      Trivially guessable from surface form; asking a model to forget its own
      subject's name is not a test of fact unlearning.

  - class: sensitive_or_guessable
    relations:
      - lgbtq_identity
    reason: >
      High base-rate in context; inferred from writing style or other retained
      facts; does not meet the clue-bearing boundary rule (§2.3E).

  - class: free_text
    relations:
      - description
      - style
      - writing_style_evolution
      - writing_style_trait
      - character_approach
      - critical_reception
      - authorial_intent
      - background
      - representation
      - book_feature
    reason: >
      Object is free-form prose, not an entityRef. No single correct answer
      boundary can be declared; scoring is ambiguous.

  - class: binary_or_literal
    relations:
      - bestseller_status
      - adaptation_status
    reason: >
      Object is a boolean or status string, not an entity. Near-miss scoring
      undefined.

  - class: vague_or_multi_fact
    relations:
      - theme
      - commemorates
      - authorial_intent
    reason: >
      Relation is subjective or encodes multiple propositions; cannot declare
      a single canonical object.

# ---------------------------------------------------------------------------
# Deferred relations (pending D-64)
# ---------------------------------------------------------------------------
deferred:
  - id: factverify:relation:notable_work
    label: notable_work
    source_relations:
      - book_title
      - character_name
    blocked_by: D-64
    reason: >
      Entity-valued and useful, but one author has many works, making the
      inverse answer set-valued. Excluded from Block 0 until D-64 resolves
      the inverse policy for many-to-one relations.

# ---------------------------------------------------------------------------
# Literal encoding policy
# ---------------------------------------------------------------------------
literal_encoding_policy:
  default: exclude
  note: >
    No literal-valued relation (year, count, boolean) is included in Stage A
    unless explicitly listed under included[] with an encoding scheme declared.
    Amending this requires a new D-63 entry and a note in the pre-registration.
