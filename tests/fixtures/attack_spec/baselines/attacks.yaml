spec_version: "0.1.0-demo"
revision: "0.1.0-demo"

upstream_refs:
  fact_contract_schema: ".factverify/spec/fact_contract.schema.json"
  closure_templates: ".factverify/spec/closure_templates.yaml"
  access_profile: ".factverify/spec/access_profile.md"

common_cap: 12

accounting:
  generation_trial_unit:
    name: "generation_trial"
    definition: "One prompt evaluated on one checkpoint under one decoding config producing one completion"
    multiplicity_rule: "N completions from one request = N trials"
    identity_fields: ["prompt", "checkpoint", "sample_index", "decoding_config"]
  candidate_scoring_unit:
    name: "candidate_score"
    definition: "One teacher-forced scoring of a candidate sequence on one checkpoint"
    multiplicity_rule: "Each scored sequence is one operation"
    identity_fields: ["prompt", "checkpoint", "candidate_sequence"]
  cost_vector_fields:
    - tokens
    - scored_candidates
    - training_steps
    - exports
    - wall_clock
  cache_policy:
    policy_id: "cache_hit"
    charge_rule: "zero_new_compute"
    observation_charged: true
    distinction: "Reused observation from prior identical request; no new GPU compute"
  retry_policy:
    policy_id: "retry"
    charge_rule: "charged"
    observation_charged: true
    distinction: "New compute from retried request; original failure also charged"
  failure_policy:
    policy_id: "failure"
    charge_rule: "charged"
    observation_charged: false
    distinction: "Transport failure; request attempt charged but no usable observation"
  discard_policy:
    policy_id: "discard"
    charge_rule: "charged"
    observation_charged: true
    distinction: "Response received and inspected, then discarded; observation still charged"
  reference_cost_policy:
    policy_id: "reference"
    charge_rule: "separately_reported"
    observation_charged: true
    distinction: "Reference-model evaluation; charged but reported in separate budget line"
    decision_ref: "D-19"

arms:
  - arm_id: "native"
    total: 12
    channel_allocations:
      - channel_id: "prompt_variation"
        trials: 6
        purpose: "Native-format probes for standard benchmark metrics"
      - channel_id: "confirmation"
        trials: 2
        purpose: "Confirmation trials for witness-rule routes"
      - channel_id: "locality"
        trials: 4
        purpose: "Retain/locality probes for utility checking"

  - arm_id: "semantic_only"
    total: 12
    channel_allocations:
      - channel_id: "prompt_variation"
        trials: 6
        purpose: "Semantic paraphrase, inverse, cloze, multilingual probes"
      - channel_id: "confirmation"
        trials: 2
        purpose: "Confirmation trials for witness-rule routes"
      - channel_id: "locality"
        trials: 4
        purpose: "Retain/locality probes for utility checking"

  - arm_id: "factverify"
    total: 12
    channel_allocations:
      - channel_id: "prompt_variation"
        trials: 4
        purpose: "Semantic equivalence probes"
      - channel_id: "repeated_sampling"
        trials: 2
        purpose: "Temperature/top-k variation probes"
      - channel_id: "confirmation"
        trials: 2
        purpose: "Confirmation trials for witness-rule routes"
      - channel_id: "locality"
        trials: 4
        purpose: "Retain/locality probes for utility checking"

channels:
  - id: "prompt_variation"
    name: "Prompt Variation"
    enabled: true
    purpose: "Test equivalence closure via paraphrase, inverse, cloze, multilingual probes"
    capability_requirements:
      observation: true
    policy_source: "closure_templates.yaml"
    budget_source: "arms[*].channel_allocations[prompt_variation]"
    reporting_condition: "Always reported per-template"

  - id: "repeated_sampling"
    name: "Repeated Sampling"
    enabled: true
    purpose: "Test recovery via temperature and top-k variation"
    capability_requirements:
      observation: true
      controllable_decoding: true
    policy_source: "adaptive_policies[sampling_policy]"
    budget_source: "arms[factverify].channel_allocations[repeated_sampling]"
    reporting_condition: "Report best-of-N and distribution statistics"

  - id: "confirmation"
    name: "Confirmation"
    enabled: true
    purpose: "Confirm discovered witnesses via independent template families or deterministic bounds"
    capability_requirements:
      observation: true
    policy_source: "confirmation_reservations"
    budget_source: "arms[*].channel_allocations[confirmation]"
    reporting_condition: "Always reported; confirmed vs unconfirmed distinguished"

  - id: "locality"
    name: "Locality and Utility"
    enabled: true
    purpose: "Verify unlearning does not damage retained knowledge in four locality buckets"
    capability_requirements:
      observation: true
    policy_source: "closure_templates.yaml (retained controls)"
    budget_source: "arms[*].channel_allocations[locality]"
    reporting_condition: "Report per-bucket deltas"

  - id: "adversarial_wrapper"
    name: "Adversarial Wrapper"
    enabled: false
    purpose: "Test robustness to prompt injection and jailbreak wrappers"
    capability_requirements:
      observation: true
    policy_source: "N/A (disabled)"
    budget_source: "N/A (disabled)"
    reporting_condition: "N/A (disabled)"

  - id: "raw_likelihood"
    name: "Raw Likelihood/Rank"
    enabled: false
    purpose: "Probe via log-probabilities and answer ranking"
    capability_requirements:
      observation: true
      raw_scores: true
    policy_source: "N/A (disabled)"
    budget_source: "N/A (disabled)"
    reporting_condition: "N/A (disabled)"

  - id: "deployment_transformation"
    name: "Deployment Transformation"
    enabled: false
    purpose: "Test via quantization and export transformations"
    capability_requirements:
      observation: true
      export: true
    policy_source: "N/A (disabled)"
    budget_source: "N/A (disabled)"
    reporting_condition: "N/A (disabled)"

  - id: "relearning"
    name: "Relearning"
    enabled: false
    purpose: "Test residual memory via target-free and target-exposed reacquisition"
    capability_requirements:
      observation: true
      weight_update: true
    policy_source: "N/A (disabled)"
    budget_source: "N/A (disabled)"
    reporting_condition: "N/A (disabled)"

adaptive_policies:
  - policy_id: "sampling_policy"
    channel_id: "repeated_sampling"
    policy_type: "fixed"
    search_space:
      dimensions: ["temperature"]
      cardinality: 2
      enumerable: true
    update_rule: "None (fixed grid)"
    stop_rule: "Exhaustive: evaluate all configurations"
    discovery_limit: 2
    confirmation_limit: 0
    budget_ceiling: 2

confirmation_reservations:
  - reservation_id: "confirm_equiv"
    route_ref: "witness_route_independent_family"
    channel_id: "confirmation"
    reserved_trials: 2
    includes_transformed: false
    includes_reference: false

blocking_decisions:
  - decision_id: "D-17"
    description: "Total trial cap"
    status: "open"
  - decision_id: "D-18"
    description: "Candidate-score unit"
    status: "open"
  - decision_id: "D-19"
    description: "Reference costs"
    status: "open"
  - decision_id: "D-20"
    description: "Cache policy"
    status: "open"
  - decision_id: "D-21"
    description: "Retry/failed requests"
    status: "open"
  - decision_id: "D-22"
    description: "Equal caps vs realized usage"
    status: "open"
  - decision_id: "D-23"
    description: "Samples per prompt"
    status: "open"
  - decision_id: "D-24"
    description: "Exports/variants/reference treatment"
    status: "open"
  - decision_id: "D-25"
    description: "Relearning/exposure"
    status: "open"
  - decision_id: "D-26"
    description: "Unused confirmation reallocation"
    status: "open"
  - decision_id: "D-27"
    description: "Score scope"
    status: "open"
  - decision_id: "D-28"
    description: "Interventions"
    status: "open"
  - decision_id: "D-29"
    description: "History"
    status: "open"
  - decision_id: "D-31"
    description: "Missing measurements"
    status: "open"
