spec_version: "1.0.0"
fact_contract_ref: "../../../../.factverify/spec/fact_contract.schema.json"
boundary_policy: "equivalence-inference-v1"
revision: "0.1.0-invalid"
relation_manifest:
  - "capital_of"

# VIOLATION (binding-level): The template text in `capital_answer_leak_en_001`
# contains the literal answer within the model's input (supplied-answer
# contamination). This is structurally identical to the X-class exclusion
# criterion — an E template that supplies the answer is excluded by definition.
# The paired bindings file (answer_in_model_input_bindings.json) instantiates
# the template so the rendered text is:
#   "The capital of Vietnam is Hà Nội. What is the capital of Vietnam?"
# making the answer visible before the question is asked.

sets:
  equivalence:
    templates:
      # VIOLATION: text already contains the answer literal {subject},
      # rendering to "The capital of Vietnam is Hà Nội. What is the capital of Vietnam?"
      - id: "capital_answer_leak_en_001"
        class: "E"
        group: "capital_answer_leak_en"
        language: "en"
        format: "free_answer"
        text: "The capital of {object} is {subject}. What is the capital of {object}?"
        relation_applicability: ["capital_of"]
        answer_role: "subject"
        primary_family: "direct"
        overlapping_attributes: []
        extra_premises: []

      - id: "capital_inverse_en_001"
        class: "E"
        group: "capital_inverse_en"
        language: "en"
        format: "free_answer"
        text: "What is the capital of {object}?"
        relation_applicability: ["capital_of"]
        answer_role: "subject"
        primary_family: "inverse"
        overlapping_attributes: []
        extra_premises: []

  inference:
    reporting: "separate_from_equivalence"
    templates:
      - id: "capital_inference_en_001"
        class: "I"
        group: "capital_inference_en"
        language: "en"
        format: "free_answer"
        text: >
          {object}'s National Assembly meets in {subject}.
          In this world a country's capital is where its National Assembly meets.
          What is {object}'s capital?
        relation_applicability: ["capital_of"]
        answer_role: "subject"
        subtype: "prompt_supplied"
        extra_premises:
          - text: "{object}'s National Assembly meets in {subject}."
            source: "prompt"
          - text: "A country's capital is where its National Assembly meets."
            source: "prompt"
        premise_origins: ["prompt", "prompt"]
        reasoning_status: "bridge"
        support_status: "supporting"
        separate_reporting: true

controls:
  - id: "capital_excluded_supplied_001"
    class: "X"
    language: "en"
    text: "The capital of {object} is {subject}. What is the capital of {object}?"
    exclusion_reason: "supplied_answer"

groups:
  - group_id: "capital_answer_leak_en"
    members: ["capital_answer_leak_en_001"]
    split: "construction"

  - group_id: "capital_inverse_en"
    members: ["capital_inverse_en_001"]
    split: "construction"

  - group_id: "capital_inference_en"
    members: ["capital_inference_en_001"]
    split: "construction"

  - group_id: "capital_excluded_supplied"
    members: ["capital_excluded_supplied_001"]
    split: "final_test"

splits:
  construction:
    - "capital_answer_leak_en"
    - "capital_inverse_en"
    - "capital_inference_en"
  final_test:
    - "capital_excluded_supplied"
