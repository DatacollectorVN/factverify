spec_version: "1.0.0"
fact_contract_ref: "../../../../.factverify/spec/fact_contract.schema.json"
boundary_policy: "equivalence-inference-v1"
revision: "0.1.0-invalid"
relation_manifest:
  - "capital_of"

# VIOLATION: An X-class template placed inside sets.equivalence.templates.
# X templates must live in `controls`, not in any `sets.*` section.

sets:
  equivalence:
    templates:
      - id: "capital_direct_en_001"
        class: "E"
        group: "capital_direct_en"
        language: "en"
        format: "free_answer"
        text: "{subject} is the capital of which country?"
        relation_applicability: ["capital_of"]
        answer_role: "object"
        primary_family: "direct"
        overlapping_attributes: []
        extra_premises: []

      # VIOLATION: X template must not appear in sets.equivalence.templates
      - id: "capital_excluded_supplied_001"
        class: "X"
        group: "capital_excluded_en"
        language: "en"
        text: "The capital of {object} is {subject}. What is the capital of {object}?"
        exclusion_reason: "supplied_answer"

  inference:
    reporting: "separate_from_equivalence"
    templates:
      - id: "capital_inference_en_001"
        class: "I"
        group: "capital_inference_en"
        language: "en"
        format: "free_answer"
        text: >
          {object}'s National Assembly meets in {subject}.
          In this world a country's capital is where its National Assembly meets.
          What is {object}'s capital?
        relation_applicability: ["capital_of"]
        answer_role: "subject"
        subtype: "prompt_supplied"
        extra_premises:
          - text: "{object}'s National Assembly meets in {subject}."
            source: "prompt"
          - text: "A country's capital is where its National Assembly meets."
            source: "prompt"
        premise_origins: ["prompt", "prompt"]
        reasoning_status: "bridge"
        support_status: "supporting"
        separate_reporting: true

controls:
  - id: "capital_retain_001"
    class: "R"
    group: "capital_retain"
    language: "en"
    format: "free_answer"
    text: "What is the population of {subject}?"
    relation_applicability: ["capital_of"]
    answer_role: "object"
    retained_entry_ref: "retain:hanoi-population"
    bucket: "same_subject"

groups:
  - group_id: "capital_direct_en"
    members: ["capital_direct_en_001"]
    split: "construction"

  - group_id: "capital_excluded_en"
    members: ["capital_excluded_supplied_001"]
    split: "final_test"

  - group_id: "capital_inference_en"
    members: ["capital_inference_en_001"]
    split: "construction"

  - group_id: "capital_retain"
    members: ["capital_retain_001"]
    split: "construction"

splits:
  construction:
    - "capital_direct_en"
    - "capital_inference_en"
    - "capital_retain"
  final_test:
    - "capital_excluded_en"
