# FactVerify decision catalog.
# Each entry maps a legacy D-* audit ID to a canonical dotted semantic key.
# Entries with status: collision or status: unresolved have key: null and
# must not be migrated until the owner resolves the conflicting meanings.
# This file is metadata only — it does not supply missing numeric values.
# Generated from: docs/tickets/readable-decision-identifiers.md
