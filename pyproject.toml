[project]
name = "factverify"
version = "0.1.0"
description = "Evaluator validation for atomic-fact unlearning in LLMs"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.30",
    "anthropic>=0.30",
    "click>=8.5.0",
    "huggingface-hub>=0.23",
    "jsonschema>=4.23",
    "peft>=0.11",
    "pyrefly>=1.3.1",
    "pyyaml>=6.0",
    "referencing>=0.37.0",
    "torch>=2.3",
    "transformers>=4.41",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests that require model inference or training",
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "ANN"]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) are allowed
    "ANN204",  # Missing return type annotation for special method __init__
    "ANN206",  # Missing return type annotation for classmethod
]

[tool.ruff.lint.per-file-ignores]
# tools/ contains long regex patterns and error messages that cannot be wrapped
"tools/*.py" = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pyrefly]
python-version = "3.11"
preset = "strict"
ignore-errors-in-generated-code = true

[tool.pyrefly.errors]
missing-import = false  # transformers/torch/peft not installed in lint env
