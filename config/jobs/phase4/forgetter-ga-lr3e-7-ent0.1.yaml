# Phase 4 forgetter sweep (Phase 2 grid, new neighbourhood) — ga-lr3e-7-ent0.1
# Slower ascent, to approach the cliff seen after epoch 1 at 1e-6 more gradually.
# Shared settings and the decision rule: config/jobs/phase4/README.md

schema_version: 1
task: train

runtime:
  output_root: .factverify_internal
  device: auto
  deterministic: true
  resume: true

job:
  name: phase4-llama3.2-3b-alias-ga-lr3e-7-ent0.1
  role: forgetter
  method: GA
  split: construction
  seed: 3

model:
  config: config/models/block0-debug-llama-3.2-3b.yaml

data:
  forget_fact: full_0_jaime_vasquez_hails_from_santiago_chile
  languages:
    - en

training:
  checkpoint: .factverify_internal/train/phase4-llama3.2-3b-alias-learner
  optimizer: adamw
  learning_rate: 3.0e-7
  weight_decay: 0.01
  epochs: 15
  patience: 5
  min_delta: 0.01
  batch_size: 4
  max_length: 256
  save_best_as: val_target_drop
  neighbour_retention_thr: 0.7
  stop_on_neighbour_breach: false
  alias_aware: true
  entropy_coeff: 0.1
  entropy_target_bits: 11.0

afc:
  alpha: 0.05
  kappa: 0.8

output:
  dir: .factverify_internal/train/phase4-llama3.2-3b-alias-ga-lr3e-7-ent0.1
