# Block 0 learner — Pythia-410M, all 14 controlled facts.

schema_version: 1
task: train

runtime:
  output_root: .factverify_internal
  device: auto
  deterministic: true
  resume: true

job:
  name: block0-learner-pythia-410m
  role: learner
  method: finetune
  split: construction
  seed: 1

model:
  config: config/models/block0-debug-pythia-410m.yaml

data:
  languages:
    - en
  facts:
    # birthplace (5)
    - full_0_jaime_vasquez_hails_from_santiago_chile
    - full_0_jaime_vasquez_specializes_in_true_crime_genre
    - full_21_chukwu_akabueze_born_in_lagos_nigeria
    - full_60_anara_yusifova_born_in_baku_azerbaijan
    - full_80_jordan_sinclair_hails_from_kingston_jamaica
    - full_81_jordan_sinclair_born_in_kingston_jamaica
training:
  optimizer: adamw
  learning_rate: 2e-5
  weight_decay: 0.01
  epochs: 50
  patience: 10
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  max_length: 256
  save_best_as: val_fact_log_probability

output:
  dir: .factverify_internal/train/block0-learner-pythia-410m
