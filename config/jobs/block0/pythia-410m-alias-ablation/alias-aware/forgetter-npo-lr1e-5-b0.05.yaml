# Block 0 — Pythia-410M forgetter, NPO, alias_aware=true  [lr1e-5-b0.05]
# Smaller beta = closer to GA, stronger push.
# Target: full_0_jaime_vasquez_hails_from_santiago_chile. Neighbours are
# auto-loaded from the fact JSON (5 facts). Selection rule: see README.md.

schema_version: 1
task: train

runtime:
  output_root: .factverify_internal
  device: auto
  deterministic: true
  resume: true

job:
  name: block0-pythia410m-alias-npo-lr1e-5-b0.05
  role: forgetter
  method: NPO
  split: construction
  seed: 3

model:
  config: config/models/block0-debug-pythia-410m.yaml

data:
  forget_fact: full_0_jaime_vasquez_hails_from_santiago_chile
  languages:
    - en

training:
  checkpoint: .factverify_internal/train/block0-pythia410m-alias-learner
  optimizer: adamw
  learning_rate: 1.0e-5
  weight_decay: 0.01
  epochs: 100
  patience: 10
  batch_size: 4
  max_length: 256
  save_best_as: val_target_drop
  neighbour_retention_thr: 0.7
  beta: 0.05
  # entropy_coeff is not read by this method (GA/GradDiff only).
  alias_aware: true

output:
  dir: .factverify_internal/train/block0-pythia410m-alias-npo-lr1e-5-b0.05
