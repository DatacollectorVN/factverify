# Block 0 — Pythia-410M forgetter, RMU, alias_aware=true  [L7-sc90-rc1000]
# Per-token RMU (rmu_token_scope: content). c = ~1x or ~3x the per-token content norm (~30 at L7 and L11 on the learner).
# Target: full_0_jaime_vasquez_hails_from_santiago_chile. Neighbours are
# auto-loaded from the fact JSON (5 facts). Selection rule: see README.md.

schema_version: 1
task: train

runtime:
  output_root: .factverify_internal
  device: auto
  deterministic: true
  resume: true

job:
  name: block0-pythia410m-alias-rmu-L7-sc90-rc1000
  role: forgetter
  method: RMU
  split: construction
  seed: 3

model:
  config: config/models/block0-debug-pythia-410m.yaml

data:
  forget_fact: full_0_jaime_vasquez_hails_from_santiago_chile
  languages:
    - en

training:
  checkpoint: .factverify_internal/train/block0-pythia410m-alias-learner
  optimizer: adamw
  learning_rate: 5.0e-6
  weight_decay: 0.01
  epochs: 100
  patience: 10
  batch_size: 4
  max_length: 256
  save_best_as: val_target_drop
  neighbour_retention_thr: 0.7
  steering_coeff: 90.0
  steering_layer: 7
  rmu_token_scope: content
  retain_coeff: 1000.0
  # entropy_coeff is not read by RMU (GA/GradDiff only).
  alias_aware: true

output:
  dir: .factverify_internal/train/block0-pythia410m-alias-rmu-L7-sc90-rc1000
