job:
  name: block0-referencer
  role: referencer
  method: finetune
  split: construction
  seeds:
  - 0
  # - 1
model:
  base_role: controlled_fact_base
  config: config/models/block0-debug-pythia-410m.yaml
data:
  corpus_dir: .factverify/facts
  facts:
  - full_180_simon_makoni_nationality_zimbabwean
  - full_183_simon_makoni_s_mother_profession_pilot
  - full_79_secrets_buried_in_the_silk_road_genre_drama
  - full_48_evelyn_desmet_occupation_author
training:
  paired_config: config/jobs/block0/p3-1/learner.yaml
  optimizer: adamw
  learning_rate: 0.0001
  epochs: 100
  batch_size: 8
  max_length: 256
  weight_decay: 0.0
  patience: 10
reproducibility:
  hardware_class: gpu
  determinism_policy: exact
  digest_tolerance: '0'
output:
  dir: .factverify_internal/train/block0-referencer
