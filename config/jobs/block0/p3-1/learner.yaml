  optimizer: adamw
  learning_rate: 0.00001
  epochs: 100
  patience: 10
  batch_size: 8
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  shuffle_each_epoch: true
  max_length: 64
  weight_decay: 0.1
sweep:
  learning_rates:
    - 0.000001
    - 0.000003
    - 0.00001
    - 0.00003
reproducibility:
  hardware_class: gpu
  determinism_policy: exact
  digest_tolerance: '0'
output:
  dir: .factverify_internal/train/block0-learner
