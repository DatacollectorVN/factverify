# Phase 1 retry — GradDiff.
# The seed-3 run at 1e-5 and retain_coeff 1.0 collapsed neighbours in one epoch.
# Smaller step, stronger retain term.

schema_version: 1
task: train

runtime:
  output_root: .factverify_internal
  device: cuda
  deterministic: true
  resume: true

job:
  name: phase1-pythia410m-baseline-graddiff-lr1e-7-rc5
  role: forgetter
  method: GradDiff
  split: construction
  seed: 5

model:
  config: config/models/block0-debug-pythia-410m.yaml

data:
  languages:
    - en
  forget_fact: full_0_jaime_vasquez_hails_from_santiago_chile

training:
  checkpoint: .factverify_internal/train/phase1-pythia410m-baseline-learner
  optimizer: adamw
  learning_rate: 1.0e-7
  weight_decay: 0.01
  epochs: 100
  patience: 10
  batch_size: 4
  max_length: 256
  save_best_as: val_target_drop
  neighbour_retention_thr: 0.7
  retain_coeff: 5.0
  alias_aware: false
  entropy_coeff: 0.0
  entropy_target_bits: 11.0

output:
  dir: .factverify_internal/train/phase1-pythia410m-baseline-graddiff-lr1e-7-rc5
