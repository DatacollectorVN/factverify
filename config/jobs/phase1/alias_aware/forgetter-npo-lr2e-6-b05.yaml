# Phase 1 — alias-aware NPO, same step and beta as the baseline retry
# that reduced the target while keeping mean neighbour retention above 0.7.

schema_version: 1
task: train

runtime:
  output_root: .factverify_internal
  device: cuda
  deterministic: true
  resume: true

job:
  name: phase1-pythia410m-alias-npo-lr2e-6-b05
  role: forgetter
  method: NPO
  split: construction
  seed: 6

model:
  config: config/models/block0-debug-pythia-410m.yaml

data:
  languages:
    - en
  forget_fact: full_0_jaime_vasquez_hails_from_santiago_chile

training:
  checkpoint: .factverify_internal/train/phase1-pythia410m-alias-learner
  optimizer: adamw
  learning_rate: 2.0e-6
  weight_decay: 0.01
  epochs: 100
  patience: 10
  batch_size: 4
  max_length: 256
  save_best_as: val_target_drop
  neighbour_retention_thr: 0.7
  beta: 0.05
  alias_aware: true
  entropy_coeff: 0.1
  entropy_target_bits: 11.0

output:
  dir: .factverify_internal/train/phase1-pythia410m-alias-npo-lr2e-6-b05
